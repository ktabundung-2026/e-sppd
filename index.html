<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Perjalanan Dinas - Kecamatan Tabundung</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c4a6e">
    <link rel="apple-touch-icon" href="https://www.sumbatimurkab.go.id/public/img/konfigurasi/logo/1747657288_a8dff28fb3906c556fac.png">

    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Eksternal -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="bg-gradient-to-br from-gov-900 via-slate-900 to-indigo-950 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Elements Latar Belakang -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- MAIN PORTAL CARD -->
    <div class="w-full max-w-lg bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 overflow-hidden relative z-10 my-8">
        
        <!-- Header Branding -->
        <div class="bg-gov-900 px-6 py-8 text-center text-white relative">
            <div class="inline-block p-3 bg-white/10 rounded-2xl mb-3 backdrop-blur-sm border border-white/10 shadow-inner">
                <img src="https://www.sumbatimurkab.go.id/public/img/konfigurasi/logo/1747657288_a8dff28fb3906c556fac.png" 
                     alt="Logo Sumba Timur" class="h-16 w-auto mx-auto object-contain drop-shadow-md">
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide uppercase">SISTEM PERJALANAN DINAS</h1>
            <p class="text-xs text-sky-200 mt-1 font-medium">Kecamatan Tabundung - Kabupaten Sumba Timur</p>
            
            <div class="mt-3 flex justify-center">
                <div id="portal-network-badge" class="px-3 py-1 rounded-full text-[11px] font-semibold flex items-center gap-1.5 shadow-md"></div>
            </div>
        </div>

        <!-- Body Selection Hub -->
        <div class="p-6 sm:p-8 space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-lg font-bold text-slate-900">Pilih Layanan Utama</h2>
                <p class="text-xs text-slate-500">Mulai perencanaan penugasan tim atau langsung buat dokumen SPPD.</p>
            </div>

            <div class="space-y-3" id="moduleOptionGroup">
                <!-- Opsi 1: Modul E-SPPD -->
                <label for="optSppd" class="relative flex items-start p-4 rounded-xl border-2 border-slate-200 bg-slate-50/50 hover:bg-emerald-50/50 hover:border-emerald-600 transition-all cursor-pointer group shadow-sm">
                    <div class="flex items-center h-5 mt-0.5">
                        <input id="optSppd" name="module_choice" type="radio" value="sppd.html" checked
                               class="w-4 h-4 text-emerald-600 border-slate-300 focus:ring-emerald-500">
                    </div>
                    <div class="ml-3.5 flex-1">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-slate-900 group-hover:text-emerald-900 flex items-center gap-2">
                                <i class="fa-solid fa-file-contract text-emerald-600"></i> Modul e-SPPD Terpadu
                            </span>
                            <span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Rekomendasi</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                            Alur bertahap 3-step: Perencanaan Tim, Penerbitan SPPD/Laporan/Kwitansi, dan Riwayat.
                        </p>
                    </div>
                </label>

                <!-- Opsi 2: Modul Perdin Tim -->
                <label for="optPerdin" class="relative flex items-start p-4 rounded-xl border-2 border-slate-200 bg-slate-50/50 hover:bg-indigo-50/50 hover:border-indigo-600 transition-all cursor-pointer group shadow-sm">
                    <div class="flex items-center h-5 mt-0.5">
                        <input id="optPerdin" name="module_choice" type="radio" value="perdin.html"
                               class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                    </div>
                    <div class="ml-3.5 flex-1">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-slate-900 group-hover:text-indigo-900 flex items-center gap-2">
                                <i class="fa-solid fa-briefcase text-indigo-600"></i> Modul Perdin & Kuota OH
                            </span>
                            <span class="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">Monitoring SK</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                            Input penugasan tim, rekapitulasi per Sub Kegiatan (SK), dan kontrol target Orang Hari (OH).
                        </p>
                    </div>
                </label>
            </div>

            <button type="button" onclick="navigateToSelectedModule()" 
                    class="w-full py-3.5 px-4 bg-gov-800 hover:bg-gov-900 text-white font-bold text-sm rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center space-x-2 group">
                <span>Masuk ke Modul</span>
                <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
            </button>

            <div class="pt-4 border-t border-slate-100 text-center">
                <p class="text-[11px] text-slate-500 font-medium">&copy; 2026 Kecamatan Tabundung - ArL</p>
            </div>
        </div>
    </div>

    <!-- Script JS Eksternal -->
    <script src="js/index.js"></script>
</body>
</html>
