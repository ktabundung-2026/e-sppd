<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Perdin & Kuota OH - Tabundung</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c4a6e">
    <link rel="apple-touch-icon" href="https://www.sumbatimurkab.go.id/public/img/konfigurasi/logo/1747657288_a8dff28fb3906c556fac.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

    <!-- CSS Eksternal -->
    <link rel="stylesheet" href="css/perdin.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-2 md:mb-0">
                <a href="sppd.html" class="bg-indigo-800 hover:bg-indigo-700 p-2 rounded-lg text-amber-300 transition" title="Ke Modul e-SPPD">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
                </a>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">E-PERDIN TABUNDUNG</h1>
                    <p class="text-xs text-indigo-200">Perencanaan Penugasan & Monitoring Kuota OH Global</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <a href="sppd.html" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-contract"></i>
                    <span>Buka e-SPPD Terpadu</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 w-full flex-1">
        <div class="lg:col-span-12 bg-white p-6 rounded-xl shadow-md border">
            <h2 class="text-lg font-bold text-indigo-950 mb-4 pb-2 border-b flex items-center justify-between">
                <span><i class="fa-solid fa-chart-line text-indigo-600 mr-2"></i> Ringkasan Rekapitulasi Kuota OH</span>
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                    <p class="text-xs font-bold text-indigo-700 uppercase">Target Total OH Global</p>
                    <p id="statTotalOH" class="text-2xl font-black text-indigo-950 mt-1">202 OH</p>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <p class="text-xs font-bold text-emerald-700 uppercase">Realisasi Perdin</p>
                    <p id="statRealisasiOH" class="text-2xl font-black text-emerald-950 mt-1">0 OH</p>
                </div>
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-100">
                    <p class="text-xs font-bold text-amber-700 uppercase">Sisa Kuota OH</p>
                    <p id="statSisaOH" class="text-2xl font-black text-amber-950 mt-1">202 OH</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-indigo-950 text-indigo-200 text-center py-3 border-t border-indigo-800 text-xs mt-8">
        <p>&copy; 2026 Kecamatan Tabundung - ArL</p>
    </footer>

    <!-- Script JS Eksternal -->
    <script src="js/perdin.js"></script>
</body>
</html>
